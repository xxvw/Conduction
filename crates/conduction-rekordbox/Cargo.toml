[package]
name = "conduction-rekordbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "rekordbox XML / USB readers and writers, exposed as conduction-export plugins."

[dependencies]
conduction-core.workspace = true
conduction-export.workspace = true
conduction-library.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tracing.workspace = true
quick-xml = { version = "0.38", features = ["serialize"] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
